<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 430" width="490" height="430">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 8px; }
    .header-bar { fill: #161b22; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .title { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #8b949e; }
    .term-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
    .user-header { font-weight: bold; fill: #58a6ff; }
    .divider { fill: #30363d; }
    .key { font-weight: bold; fill: #79c0ff; }
    .val { fill: #c9d1d9; }
    .cursor { fill: #58a6ff; }
    @keyframes lineFadeIn {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .stagger-line {
      opacity: 0;
      animation: lineFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .cursor { animation: blink 1s infinite; }
  </style>
